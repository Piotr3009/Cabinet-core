<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ─── TURN 35 (CLAUDE.md F16): THE APP'S OWN MARK ──────────────────────
         "The 404 goes: a simple original mark (the app's own square/monogram —
         nothing licensed), favicon.ico + the link tag."
         A squared C — Cabinet Core's initial, cut in straight lines on a grid
         the way the app cuts everything else — with a square knob in its
         mouth, so the letter is also a carcass with a handle. Four rectangles,
         gold on shell-900 (tailwind.config.js, the app's own palette).
         `public/favicon.svg` is the same four rectangles and is the geometry
         the .ico is cut from; the .ico is what the spec names and what a
         browser asks for by default, so it is declared FIRST. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cabinet Core</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
